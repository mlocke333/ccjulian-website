name: Deploy to Cloudflare Pages

on:
  push:
    branches: [ "master" ]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Deploy to Cloudflare Pages
        uses: cloudflare/pages-action@v1
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: 333c045b18d7189ea99fba8df9143717
          projectName: ccjulian-website
          branch: master
          directory: .
          gitHubToken: ${{ secrets.GITHUB_TOKEN }}
